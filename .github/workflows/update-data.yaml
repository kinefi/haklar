name: Update KV Catalog, Tax Brackets & RAG Index

on:
  schedule:
    # Her Pazartesi sabahı UTC 04:00'te (Avusturya saatiyle 05:00/06:00) otomatik çalışır
    - cron: "0 4 * * 1"
  workflow_dispatch:
    # GitHub arayüzündeki "Actions" sekmesinden elle tetikleyebilmek için

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update collective agreements catalog
        run: python3 scripts/update-kv-catalog.py

    - name: Update Austrian Income Tax Brackets
      run: python3 scripts/update-tax-brackets.py

    - name: Rebuild RAG Index
      run: python3 scripts/build-rag-index.py --fetch-sections

      - name: Commit and push updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/collective-agreements.json content/income-tax-current.json content/rag-index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update KV catalog, tax brackets and RAG index"
            git push
          else
            echo "No changes to commit."
          fi