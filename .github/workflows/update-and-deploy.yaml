name: Update KV Catalog, Tax Brackets & RAG Index & Deploy

on:
  push:
    branches:
      - main  # main branch'ine her push yapıldığında çalışır
  schedule:
    # Her Pazartesi sabahı UTC 04:00'te otomatik çalışır
    - cron: "0 4 * * 1"
  workflow_dispatch:
    # GitHub arayüzünden elle tetiklenebilmesi için

permissions:
  contents: write
  pages: write      # GitHub Pages'e yazma yetkisi
  id-token: write   # Pages güvenli kimlik doğrulaması için

# Eş zamanlı çakışmaları önlemek için
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update collective agreements catalog
        run: python3 scripts/update-kv-catalog.py

      - name: Update Austrian Income Tax Brackets
        run: python3 scripts/update-tax-brackets.py

      - name: Rebuild RAG Index
        run: python3 scripts/build-rag-index.py --fetch-sections

      - name: Commit and push updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/collective-agreements.json content/income-tax-current.json content/rag-index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update KV catalog, tax brackets and RAG index [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

  # Veriler güncellendikten hemen sonra güvenle devreye giren Pages deployment adımı
  deploy-pages:
    needs: update-content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # Projenin kök dizini (veya statik dosyaların olduğu klasör, örn: './public' veya './dist')

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4