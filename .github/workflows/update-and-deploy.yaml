name: Update KV Catalog, Tax Brackets & Search Index & Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Aynı anda tek çalışma; yarıda kalan bir yayını iptal etmemek için cancel-in-progress kapalı.
concurrency:
  group: "pages-and-update"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Birkaç KV sayfası okunamazsa betik önceki kayıtları korur ve yalnızca çok sayıda hata olursa başarısız olur.
      - name: Update collective agreements catalog
        run: python3 scripts/update-kv-catalog.py

      - name: Update Austrian Income Tax Brackets
        run: python3 scripts/update-tax-brackets.py

      - name: Rebuild search index and topic map
        run: |
          python3 scripts/build-search-index.py
          node scripts/build-topic-map.mjs

      - name: Run search tests
        run: node --test tests/*.test.mjs

      - name: Commit and push updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/collective-agreements.json content/income-tax-current.json content/search-index.json content/topic-concepts.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update KV catalog, tax brackets and search index [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

      # Yayın aynı işte, güncellenmiş dosyalarla yapılır. (Önceden ayrı iş, güncellemeden önceki commit'i
      # yayınlıyordu; yeni veri ancak bir sonraki çalışmada siteye çıkıyordu.)
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
