name: Update KV Catalog, Tax Brackets & RAG Index & Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write      
  id-token: write   

# Eskileri otomatik iptal eden ayar:
concurrency:
  group: "pages-and-update"
  cancel-in-progress: true

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update collective agreements catalog
        run: python3 scripts/update-kv-catalog.py

      - name: Update Austrian Income Tax Brackets
        run: python3 scripts/update-tax-brackets.py

      - name: Rebuild RAG Index
        run: python3 scripts/build-rag-index.py

      - name: Run search tests
        run: node --test tests/search.test.mjs

      - name: Commit and push updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/collective-agreements.json content/income-tax-current.json content/rag-index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update KV catalog, tax brackets and RAG index [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

  deploy-pages:
    needs: update-content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # Eğer özel bir build klasörün varsa (örn: 'dist'), burayı güncelleyebilirsin.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4